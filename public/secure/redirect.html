<!doctype html>
<html lang="tr">
<head><meta charset="utf-8"><title>Yönlendirme</title></head>
<body>
  <p id="status">bekleniyor...</p>
  <script>
    // CWE-601 Client-side Open Redirect.
    // GÜVENLİ: yalnızca aynı origin'e (göreli yol) izin verilir.
    // Test edilebilirlik için karar mantığı ayrı bir saf fonksiyona çıkarıldı;
    // gerçek sayfa davranışı da aynı fonksiyonu çağırır.
    window.evaluateRedirect = function (to) {
      try {
        const target = new URL(to, location.href);
        if (target.origin !== location.origin) {
          return { allowed: false, target: target.href };
        }
        return { allowed: true, target: target.href };
      } catch {
        return { allowed: false, target: null };
      }
    };

    (function () {
      const params = new URLSearchParams(location.search);
      const to = params.get('to');
      if (!to) { document.getElementById('status').textContent = 'hedef yok'; return; }
      const decision = window.evaluateRedirect(to);
      document.getElementById('status').textContent = decision.allowed
        ? ('yönlendiriliyor: ' + decision.target)
        : 'reddedildi: dış URL';
      if (decision.allowed) location.href = decision.target;
    })();
  </script>
</body>
</html>
