name: OWASP API Security Tests (Extended)

# NOT: `api` projesi APIRequestContext (saf HTTP) kullanır, tarayıcı
# gerektirmez. `chromium` projesi (Client-side/DevTools ailesi) gerçek bir
# tarayıcı gerektirir — bu yüzden yalnızca chromium indirilir (tüm tarayıcılar
# değil), CI süresini kısa tutmak için.

on:
  workflow_dispatch:
    inputs:
      test_target:
        description: 'Hangi API hedeflensin'
        required: true
        default: 'secure'
        type: choice
        options:
          - secure        # Tüm testler PASS — savunmalar doğrulandı
          - vulnerable    # Açıklar tespit edilir — çoğu test FAIL beklenir
          - both          # Her iki mod da sırayla çalıştırılır
  push:
    branches: [main]
  pull_request:

env:
  # better-sqlite3@13 ve graphql@17 Node >=22 gerektirir (engines alanı) —
  # Node 20 ile sunucu hiç çıktı vermeden çöküyor ve health-check timeout'a düşüyor.
  NODE_VERSION: '22'

jobs:
  test-secure:
    name: "🔒 Secure API — tüm testler PASS beklenir"
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.test_target == 'secure' || inputs.test_target == 'both' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium (yalnızca client-side ailesi için)
        run: npx playwright install --with-deps chromium

      - name: Run security tests (Secure API)
        run: npx playwright test --reporter=list,html
        env:
          CI: true

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-secure
          path: playwright-report/
          retention-days: 30

  test-vulnerable:
    name: "🔓 Vulnerable API — güvenlik açıkları TESPİT EDİLİR (FAIL beklenir)"
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.test_target == 'vulnerable' || inputs.test_target == 'both' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium (yalnızca client-side ailesi için)
        run: npx playwright install --with-deps chromium

      - name: Run security tests (Vulnerable API)
        # FAIL'ler beklenen sonuçtur — exit code yok sayılır ki job abort olmasın.
        run: npx playwright test --config=playwright.config.vulnerable.ts --reporter=list,html || true
        env:
          CI: true

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-vulnerable
          path: playwright-report-vulnerable/
          retention-days: 30

      - name: Vulnerability summary
        if: always()
        run: |
          echo "========================================"
          echo "  Zafiyet Tespit Özeti"
          echo "========================================"
          echo "  FAILED testler = güvenlik açığı tespit edildi"
          echo "  PASSED testler = (pozitif kontroller hariç) beklenmeyen durum"
          echo "========================================"
